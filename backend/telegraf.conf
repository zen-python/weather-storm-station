[agent]
  interval = "10s"
  flush_interval = "10s"

[[inputs.socket_listener]]
  service_address = "udp://:5000"
  data_format = "json"
  name_override = "weather"
  tag_keys = ["id"]

[[processors.starlark]]
  namepass = ["weather"]
  source = '''
state = {
    "history": []
}

def apply(metric):
    temp = metric.fields.get("temp")
    hum = metric.fields.get("hum")
    current_press = metric.fields.get("press")
    current_time = int(metric.time / 1000000000)

    if temp == None or hum == None or current_press == None:
        return metric

    a = 17.27
    b = 237.7

    alpha = ((a * temp) / (b + temp)) + math.log(hum / 100.0)
    dew_point = (b * alpha) / (a - alpha)

    metric.fields["dew_point"] = dew_point

    temp_dew_gap = temp - dew_point
    metric.fields["temp_dew_gap"] = temp_dew_gap

    state["history"].append((current_time, current_press))

    three_hours_ago = current_time - 10800
    state["history"] = [p for p in state["history"] if p[0] >= three_hours_ago]

    if len(state["history"]) < 2:
        return metric

    oldest_press = state["history"][0][1]
    pressure_trend = current_press - oldest_press
    metric.fields["pressure_trend_3h"] = pressure_trend

    if pressure_trend <= -3.0:
        metric.tags["alert_trigger"] = "true"
        metric.fields["alert_message"] = "CRITICAL STORM ALERT: Barometric pressure is dropping rapidly! Trend: %.1f hPa over 3 hours. Expect high winds and severe weather." % pressure_trend

    if metric.fields.get("lt_count", 0) > 0 and metric.fields.get("lt_dist", 99) <= 15:
        metric.tags["alert_trigger"] = "true"
        metric.fields["alert_message"] = "THUNDERSTORM DETECTED: Active lightning front registered only %d km away from your base station." % int(metric.fields.get("lt_dist"))

    if pressure_trend <= -1.2 and temp_dew_gap <= 3.0:
        metric.tags["alert_trigger"] = "true"
        metric.fields["alert_message"] = "RAIN FORECAST: Incoming low-pressure system detected. Air-to-moisture gap has narrowed to %.1f C. Precipitation expected within 2 to 6 hours." % temp_dew_gap

    return metric
'''

[[outputs.influxdb_v2]]
  urls = ["http://influxdb:8086"]
  token = "CHANGE_ME_TO_SECURE_TOKEN"
  organization = "home"
  bucket = "weather"

[[outputs.http]]
  url = "https://api.pushover.net/1/messages.json"
  method = "POST"
  data_format = "form"

  [outputs.http.tagpass]
    alert_trigger = ["true"]

  [outputs.http.constants]
    token = "YOUR_PUSHOVER_APP_TOKEN"
    user = "YOUR_PUSHOVER_USER_KEY"
    title = "Local Storm Alert"
    priority = "1"
    sound = "thunder"

  [outputs.http.field_mapping]
    alert_message = "message"
